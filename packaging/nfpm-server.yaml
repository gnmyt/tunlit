name: tunlit-server
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
section: net
priority: optional
maintainer: "Mathias Wagner <mathias@gnm.dev>"
description: |
  tunlit server - tunnel server with the web interface bundled in
vendor: "tunlit"
homepage: "https://github.com/gnmyt/tunlit"
license: "MIT"

overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc

contents:
  - src: stage/server/tunlit-server
    dst: /usr/bin/tunlit-server
    file_info:
      mode: 0755

  - src: packaging/tunlit-server.service
    dst: /lib/systemd/system/tunlit-server.service
    file_info:
      mode: 0644

  - src: packaging/server.env
    dst: /etc/tunlit-server/server.env
    type: config|noreplace
    file_info:
      mode: 0640

  - dst: /var/lib/tunlit-server
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: packaging/scripts/server-postinstall.sh
  preremove: packaging/scripts/server-preremove.sh
  postremove: packaging/scripts/server-postremove.sh
