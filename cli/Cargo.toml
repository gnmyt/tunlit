[package]
name = "tunlit"
version = "0.1.1"
edition = "2021"
description = "CLI client for tunlit"
authors = ["Mathias Wagner"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
reqwest = { version = "0.13", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.12"
console = "0.16"
dirs = "7"
anyhow = "1"
futures-util = "0.3"
open = "5"
indicatif = "0.18"
qrcode = { version = "0.14", default-features = false }
arboard = { version = "3", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
