name: Deploy Development Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

env:
  IMAGE_NAME: germannewsmaker/tunlit

jobs:
  development:
    name: "Development image"
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'Release ')"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Name this build
        id: build
        run: echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:development
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
