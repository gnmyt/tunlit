name: Build CLI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      semver:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    name: "CLI (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: tunlit-linux-x64
            is_linux: true
            deb_arch: amd64
            rpm_arch: x86_64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: tunlit-linux-arm64
            is_linux: true
            deb_arch: arm64
            rpm_arch: aarch64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tunlit-macos-arm64
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tunlit-macos-x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tunlit-windows-x64.exe
            is_windows: true
            msi_arch: x64
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: tunlit-windows-arm64.exe
            is_windows: true
            msi_arch: arm64

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
          key: ${{ matrix.target }}

      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml
          fi

      - name: Build CLI
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'tunlit.exe' || 'tunlit' }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.artifact_name }}" --clobber

      - name: Install nfpm
        if: matrix.is_linux
        shell: bash
        run: |
          NFPM_VERSION=2.43.0
          case "$(uname -m)" in
            x86_64) HOST=x86_64 ;;
            aarch64|arm64) HOST=arm64 ;;
          esac
          TMP=$(mktemp -d)
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${HOST}.tar.gz" -o "$TMP/nfpm.tar.gz"
          tar -xzf "$TMP/nfpm.tar.gz" -C "$TMP" nfpm
          sudo install -m 0755 "$TMP/nfpm" /usr/local/bin/nfpm
          rm -rf "$TMP"

      - name: Build the .deb and the .rpm
        if: matrix.is_linux
        shell: bash
        env:
          PKG_VERSION: ${{ inputs.semver }}
        run: |
          mkdir -p stage/cli dist
          cp "dist/${{ matrix.artifact_name }}" stage/cli/tunlit 2>/dev/null || cp "cli/target/${{ matrix.target }}/release/tunlit" stage/cli/tunlit
          chmod +x stage/cli/tunlit

          PKG_ARCH=${{ matrix.deb_arch }} nfpm pkg \
            --config packaging/nfpm-cli.yaml \
            --packager deb \
            --target "dist/tunlit-cli-${{ matrix.deb_arch }}.deb"

          PKG_ARCH=${{ matrix.rpm_arch }} nfpm pkg \
            --config packaging/nfpm-cli.yaml \
            --packager rpm \
            --target "dist/tunlit-cli-${{ matrix.rpm_arch }}.rpm"

      - name: Upload the packages
        if: matrix.is_linux
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --clobber

      - name: Install WiX
        if: matrix.is_windows
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the installer
        if: matrix.is_windows
        shell: bash
        env:
          PKG_VERSION: ${{ inputs.semver }}
        run: |
          wix build packaging/windows/tunlit.wxs \
            -arch ${{ matrix.msi_arch }} \
            -d Version="$PKG_VERSION" \
            -d BinPath="dist/${{ matrix.artifact_name }}" \
            -o "dist/tunlit-${{ matrix.msi_arch }}.msi"

      - name: Upload the installer
        if: matrix.is_windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.msi --clobber

  build-cli-static:
    name: "CLI static (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
          - name: linux-armv7
            target: armv7-unknown-linux-musleabihf
            deb_arch: armhf
            rpm_arch: armv7hl
          - name: linux-riscv64
            target: riscv64gc-unknown-linux-musl
            deb_arch: riscv64
            rpm_arch: riscv64

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Stamp the version
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml

      - name: Build CLI
        working-directory: cli
        run: cargo zigbuild --release --no-default-features --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/tunlit" "dist/tunlit-${{ matrix.name }}-static"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/tunlit-${{ matrix.name }}-static" --clobber

      - name: Install nfpm
        if: matrix.deb_arch
        run: |
          NFPM_VERSION=2.43.0
          TMP=$(mktemp -d)
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -o "$TMP/nfpm.tar.gz"
          tar -xzf "$TMP/nfpm.tar.gz" -C "$TMP" nfpm
          sudo install -m 0755 "$TMP/nfpm" /usr/local/bin/nfpm
          rm -rf "$TMP"

      - name: Build the .deb and the .rpm
        if: matrix.deb_arch
        env:
          PKG_VERSION: ${{ inputs.semver }}
        run: |
          mkdir -p stage/cli
          cp "dist/tunlit-${{ matrix.name }}-static" stage/cli/tunlit
          chmod +x stage/cli/tunlit
          PKG_ARCH=${{ matrix.deb_arch }} nfpm pkg --config packaging/nfpm-cli-static.yaml --packager deb --target "dist/tunlit-cli-${{ matrix.deb_arch }}.deb"
          PKG_ARCH=${{ matrix.rpm_arch }} nfpm pkg --config packaging/nfpm-cli-static.yaml --packager rpm --target "dist/tunlit-cli-${{ matrix.rpm_arch }}.rpm"

      - name: Upload the packages
        if: matrix.deb_arch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --clobber
