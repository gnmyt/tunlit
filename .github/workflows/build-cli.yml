name: Build CLI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    name: "CLI (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: tunlit-linux-x64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: tunlit-linux-arm64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tunlit-macos-arm64
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            artifact_name: tunlit-macos-x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tunlit-windows-x64.exe

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml
          fi

      - name: Build CLI
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'tunlit.exe' || 'tunlit' }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.artifact_name }}" --clobber
